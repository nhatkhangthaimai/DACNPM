services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: hiresense-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        fromDatabase:
          name: hiresense-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # 2. React + Vite Frontend Static Site
  - type: web
    name: hiresense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hiresense-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: hiresense-db
    databaseName: hiresense_db
    plan: free
